services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Mongo: mongodb://mongo:27017/invoicepilot
      DataProtection__KeysPath: /keys
      ForwardedHeaders__Enabled: "true"
      # Demo users share this password. Change it outside your own machine.
      Auth__DemoPassword: ${DEMO_PASSWORD:-invoicepilot-demo}
      # Point at the LLM Gateway (or any OpenAI-compatible endpoint) to use a real model.
      # Without a base URL, the rule-based demo stand-in is used (not an AI; see DemoLlmClient).
      Ai__Provider: ${AI_PROVIDER:-demo}
      Ai__BaseUrl: ${AI_BASE_URL:-}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__Model: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - keys:/keys
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  mongo-data:
  keys:
